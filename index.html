<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de paletas</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main>
        <h1>Generador de paletas de colores</h1>

        <p> Crea tu propia combinación de colores</p>

        <label for="cantidad">¿Cuántos colores quieres generar?</label>

        <select id="cantidad">
            <option value="6" selected>6 colores</option>
            <option value="8">8 colores</option>
            <option value="9">9 colores</option>
        </select>

        <button id="generar">Generar paleta</button>
        
        <p id="mensaje" role="status" aria-live="polite"></p>

        <section id="paleta"></section>
    </main>

    
</body>
</html>
